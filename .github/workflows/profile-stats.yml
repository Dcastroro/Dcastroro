name: Refresh profile stats

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"
      - "scripts/generate-adventure-trophies.mjs"
  schedule:
    # GitHub does not forward push events from other repositories to the
    # profile repository, so poll twice an hour away from the busy :00 slot.
    - cron: "17,47 * * * *"
  repository_dispatch:
    types:
      - profile-stats-refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate animated profile visuals
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/generate-adventure-trophies.mjs

      - name: Commit animated profile visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/adventure-trophies.svg assets/animated-ledger.svg
          if git diff --cached --quiet; then
            echo "Animated profile visuals are already current."
          else
            git commit -m "Refresh animated profile visuals"
            git push
          fi

      - name: Generate profile cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.ref_name }}
          UTC_OFFSET: 2
          THEME: tokyonight
          AUTO_PUSH: true
