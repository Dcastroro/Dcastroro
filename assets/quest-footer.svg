<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="245" viewBox="0 0 1000 245" role="img" aria-labelledby="title desc">
  <title id="title">Credentials and invitation to connect</title>
  <desc id="desc">Telecommunications Engineering, PCAP and PSM I credentials with an animated beacon inviting collaboration.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c2231"/><stop offset="1" stop-color="#11162b"/></linearGradient>
    <linearGradient id="gold"><stop stop-color="#fff2ae"/><stop offset="1" stop-color="#c98a2c"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#d69cff" stop-opacity=".18"/><stop offset="1" stop-color="#d69cff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0v34" fill="none" stroke="#72e8dc" stroke-opacity=".04"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:Arial,sans-serif}.serif{font-family:Georgia,serif}
      .beacon{transform-box:fill-box;transform-origin:center;animation:beacon 4s cubic-bezier(.77,0,.175,1) infinite}
      .ring{transform-box:fill-box;transform-origin:center;animation:ring 4s cubic-bezier(.23,1,.32,1) infinite}
      .star{animation:star 2.8s ease infinite alternate}.s2{animation-delay:-1.4s}
      .signal{animation:signal 5s linear infinite}.sig2{animation-delay:-2.5s}
      @keyframes beacon{0%,100%{transform:scale(1);opacity:.88}50%{transform:scale(1.06);opacity:1}}
      @keyframes ring{0%{transform:scale(.92);opacity:.6}80%,100%{transform:scale(1.3);opacity:0}}
      @keyframes star{from{opacity:.25}to{opacity:1}}
      @keyframes signal{0%{transform:translateX(0);opacity:0}12%,88%{opacity:1}100%{transform:translateX(470px);opacity:0}}
      @media(prefers-reduced-motion:reduce){.beacon{animation:soft 5s linear infinite}.ring,.signal{display:none}@keyframes soft{0%,100%{opacity:.88}50%{opacity:1}}}
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="243" rx="18" fill="url(#bg)" stroke="#d2a03c" stroke-width="2"/>
  <rect x="9" y="9" width="982" height="227" rx="13" fill="url(#grid)" stroke="#31516a"/>
  <ellipse cx="784" cy="123" rx="180" ry="120" fill="url(#aura)"/>
  <circle class="star" cx="62" cy="42" r="2" fill="#fff0a6" filter="url(#glow)"/><circle class="star s2" cx="934" cy="54" r="2" fill="#9efff5" filter="url(#glow)"/>

  <text x="54" y="47" class="serif" fill="#f5d47b" font-size="18" font-weight="700" letter-spacing="2">CREDENTIALS</text>
  <path d="M54 61H570" stroke="#d2a03c" stroke-opacity=".42"/>
  <circle class="signal" cx="54" cy="61" r="3" fill="#fff0a6" filter="url(#glow)"/><circle class="signal sig2" cx="54" cy="61" r="3" fill="#72e8dc" filter="url(#glow)"/>

  <g transform="translate(54 82)">
    <rect width="516" height="40" rx="10" fill="#0d2331" stroke="#3b6174"/>
    <circle cx="22" cy="20" r="11" fill="#2c2516" stroke="#e3b54c"/><path d="m16 20 4 4 8-9" fill="none" stroke="#ffe99a" stroke-width="2"/>
    <text x="45" y="17" fill="#eff5f7" font-size="12" font-weight="700">BSc Telecommunications Engineering</text>
    <text x="45" y="31" fill="#78dcd7" font-size="9">Universitat Oberta de Catalunya</text>
  </g>
  <g transform="translate(54 132)">
    <rect width="250" height="40" rx="10" fill="#0d2331" stroke="#3b6174"/>
    <circle cx="22" cy="20" r="11" fill="#162d37" stroke="#57cec8"/><text x="22" y="24" text-anchor="middle" fill="#a9fff8" font-size="9" font-weight="700">P</text>
    <text x="45" y="18" fill="#eff5f7" font-size="12" font-weight="700">PCAP</text><text x="45" y="31" fill="#78dcd7" font-size="9">Python · OpenEDG</text>
  </g>
  <g transform="translate(320 132)">
    <rect width="250" height="40" rx="10" fill="#0d2331" stroke="#3b6174"/>
    <circle cx="22" cy="20" r="11" fill="#241c38" stroke="#b77edc"/><text x="22" y="24" text-anchor="middle" fill="#eccfff" font-size="8" font-weight="700">S</text>
    <text x="45" y="18" fill="#eff5f7" font-size="12" font-weight="700">PSM I</text><text x="45" y="31" fill="#bd91da" font-size="9">Professional Scrum Master</text>
  </g>
  <text x="54" y="207" fill="#8ba9b6" font-size="10">Based in León, Spain · Working remotely</text>

  <path d="M620 35V210" stroke="#3d5a6c"/>
  <g transform="translate(790 92)">
    <circle class="ring" r="48" fill="none" stroke="#d69cff" stroke-width="2"/>
    <g class="beacon">
      <circle r="42" fill="#17223b" stroke="url(#gold)" stroke-width="2"/>
      <path d="M0-24 6-7 23-11 10 2 22 15 5 9 0 27-5 9-22 15-10 2-23-11-6-7Z" fill="#f5dc83" opacity=".9"/>
      <circle r="7" fill="#fff8cf"/>
    </g>
  </g>
  <text x="790" y="158" text-anchor="middle" class="serif" fill="#f4d37a" font-size="17" font-weight="700">READY FOR THE NEXT QUEST?</text>
  <text x="790" y="181" text-anchor="middle" fill="#eef5f8" font-size="11">Let’s build systems teams can trust.</text>
  <rect x="700" y="196" width="180" height="29" rx="14" fill="#173641" stroke="#69dcd6"/>
  <text x="790" y="215" text-anchor="middle" fill="#9efff5" font-size="10" font-weight="700" letter-spacing="1">CONNECT ON LINKEDIN  →</text>
</svg>
