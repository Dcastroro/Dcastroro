<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="238" viewBox="0 0 1000 238" role="img" aria-labelledby="title desc">
  <title id="title">How I build: production, cross-functional and responsible</title>
  <desc id="desc">Three subtly animated pillars for reliable production systems, engineering and business enablement, and security-aware delivery.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10293a"/>
      <stop offset="1" stop-color="#091522"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff1a8"/>
      <stop offset=".48" stop-color="#e7b84b"/>
      <stop offset="1" stop-color="#a76a20"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9cfff5"/>
      <stop offset="1" stop-color="#37bdb8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#efc7ff"/>
      <stop offset="1" stop-color="#a970dc"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#e7b84b" stop-opacity=".2"/>
      <stop offset="1" stop-color="#e7b84b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#7eddd9" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .card{opacity:1;transform-box:fill-box;transform-origin:center;animation:arrive 6s cubic-bezier(.77,0,.175,1) infinite}
      .c2{animation-delay:.05s}.c3{animation-delay:.1s}
      .icon{transform-box:fill-box;transform-origin:center;animation:breathe 4.8s cubic-bezier(.77,0,.175,1) infinite}
      .i2{animation-delay:-1.6s}.i3{animation-delay:-3.2s}
      .spark{animation:shimmer 2.8s cubic-bezier(.77,0,.175,1) infinite}
      .traveler{animation:travel 5s linear infinite}
      .t2{animation-delay:-2.5s}
      @keyframes arrive{0%,100%{opacity:.92}50%{opacity:1}}
      @keyframes breathe{0%,100%{transform:scale(1);opacity:.88}50%{transform:scale(1.045);opacity:1}}
      @keyframes shimmer{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes travel{0%{transform:translateX(0);opacity:0}12%,88%{opacity:.85}100%{transform:translateX(270px);opacity:0}}
      @media (prefers-reduced-motion:reduce){
        .card{animation:fade .2s ease-out forwards}
        .icon{animation:soft 4.8s linear infinite}
        .traveler{display:none}
        @keyframes fade{from{opacity:0}to{opacity:1}}
        @keyframes soft{0%,100%{opacity:.88}50%{opacity:1}}
      }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="236" rx="18" fill="#07131f" stroke="#c99735" stroke-width="2"/>
  <rect x="9" y="9" width="982" height="220" rx="13" fill="url(#grid)" stroke="#31526b"/>
  <ellipse cx="500" cy="216" rx="420" ry="86" fill="url(#halo)" opacity=".28"/>
  <path d="M60 48H940" stroke="#e7b84b" stroke-opacity=".16"/>
  <circle class="traveler" cx="94" cy="48" r="2.4" fill="#fff1a8" filter="url(#glow)"/>
  <circle class="traveler t2" cx="366" cy="48" r="2.4" fill="#9cfff5" filter="url(#glow)"/>

  <g transform="translate(25 34)">
    <g class="card">
      <rect width="300" height="176" rx="14" fill="url(#panel)" stroke="#d7b054" stroke-opacity=".62"/>
      <path d="M14 14h38M248 14h38M14 162h38M248 162h38" stroke="#e7b84b" stroke-linecap="round"/>
      <g transform="translate(150 49)">
        <g class="icon">
          <circle r="33" fill="#0a1c2a" stroke="url(#gold)" stroke-width="2"/>
          <path d="M0-22 19-11v22L0 22-19 11v-22Z" fill="none" stroke="#f5d77c" stroke-width="2"/>
          <path d="m-11 3 8 8L13-8" fill="none" stroke="#fff1a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle class="spark" cx="22" cy="-21" r="3" fill="#fff1a8" filter="url(#glow)"/>
        </g>
      </g>
      <text x="150" y="104" text-anchor="middle" fill="#f9dc83" font-family="Georgia,serif" font-size="17" font-weight="700" letter-spacing="2">PRODUCTION</text>
      <text x="150" y="130" text-anchor="middle" fill="#f3f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="700">Reliable systems</text>
      <text x="150" y="151" text-anchor="middle" fill="#83dcd7" font-family="Arial,sans-serif" font-size="12">not demos</text>
    </g>
  </g>

  <g transform="translate(350 34)">
    <g class="card c2">
      <rect width="300" height="176" rx="14" fill="url(#panel)" stroke="#58d0cb" stroke-opacity=".62"/>
      <path d="M14 14h38M248 14h38M14 162h38M248 162h38" stroke="#58d0cb" stroke-linecap="round"/>
      <g transform="translate(150 49)">
        <g class="icon i2" fill="none" stroke="url(#teal)" stroke-width="2">
          <circle r="11" fill="#102d39"/>
          <circle cx="-26" cy="-16" r="7" fill="#102d39"/>
          <circle cx="27" cy="-17" r="7" fill="#102d39"/>
          <circle cx="-25" cy="19" r="7" fill="#102d39"/>
          <circle cx="26" cy="20" r="7" fill="#102d39"/>
          <path d="m-10-6-10-7M10-6l11-7M-10 7l-10 8M10 8l11 8"/>
          <circle class="spark" r="3" fill="#cafffa" stroke="none" filter="url(#glow)"/>
        </g>
      </g>
      <text x="150" y="104" text-anchor="middle" fill="#8ff3ec" font-family="Georgia,serif" font-size="16" font-weight="700" letter-spacing="1.4">CROSS-FUNCTIONAL</text>
      <text x="150" y="130" text-anchor="middle" fill="#f3f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="700">Engineering + business</text>
      <text x="150" y="151" text-anchor="middle" fill="#83dcd7" font-family="Arial,sans-serif" font-size="12">enablement</text>
    </g>
  </g>

  <g transform="translate(675 34)">
    <g class="card c3">
      <rect width="300" height="176" rx="14" fill="url(#panel)" stroke="#b986df" stroke-opacity=".62"/>
      <path d="M14 14h38M248 14h38M14 162h38M248 162h38" stroke="#b986df" stroke-linecap="round"/>
      <g transform="translate(150 49)">
        <g class="icon i3">
          <circle r="33" fill="#151b32" stroke="url(#violet)" stroke-width="2"/>
          <path d="M0-24c9 7 18 8 23 9v15c0 14-10 24-23 30C-13 24-23 14-23 0v-15c6-1 15-2 23-9Z" fill="#382553" stroke="#e0b8fa" stroke-width="2"/>
          <path d="m-10 1 7 7L11-7" fill="none" stroke="#f4deff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle class="spark" cx="22" cy="-21" r="3" fill="#efc7ff" filter="url(#glow)"/>
        </g>
      </g>
      <text x="150" y="104" text-anchor="middle" fill="#dab1f5" font-family="Georgia,serif" font-size="17" font-weight="700" letter-spacing="2">RESPONSIBLE</text>
      <text x="150" y="130" text-anchor="middle" fill="#f3f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="700">Security-aware</text>
      <text x="150" y="151" text-anchor="middle" fill="#cba4e8" font-family="Arial,sans-serif" font-size="12">by design</text>
    </g>
  </g>
</svg>
